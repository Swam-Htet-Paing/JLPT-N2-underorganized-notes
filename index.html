<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT Note Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <h1>JLPT Note Viewer</h1>
      <div class="controls-wrapper">
        <button id="furigana-toggle" class="btn-toggle">Furigana: OFF</button>
        <div class="selector-wrapper">
          <label for="note-select">Select Exam:</label>
          <select id="note-select"></select>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h2 id="file-title">Loading...</h2>
      <div id="notes-container"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
