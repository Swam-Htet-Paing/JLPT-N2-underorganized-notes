<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT Note Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP HEADER WITH DROPDOWN -->
  <header class="app-header">
    <div class="header-container">
      <h1>JLPT Note Viewer</h1>
      <div class="selector-wrapper">
        <label for="note-select">Select Exam:</label>
        <select id="note-select">
          <option value="2025JulyN2.txt">2025 July N2</option>
          <option value="2025DecN2.txt">2025 Dec N2</option>
        </select>
      </div>
    </div>
  </header>

  <!-- DYNAMIC CONTENT CONTAINER -->
  <main class="container">
    <section class="card">
      <h2 id="file-title">Loading...</h2>
      <div id="notes-container" class="notes-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
